include_fragments = "full"
# Don't fail on rate limits or server errors from external sites.
accept = '100..=103, 200..=299, 429, 500..=599'

remap = [
  # Workaround for https://github.com/lycheeverse/lychee/issues/1729
  "https://github.com/(.*?)/(.*?)/blob/(.*?)/(.*#.*)$ https://raw.githubusercontent.com/$1/$2/$3/$4"
]

exclude = [
  'https://linkedin.com/*',
  'https://twitter.com/*',
  'https://x.com/*',
  # When the changelog is committed, release-plz didn't create the tag yet
  'https://github.com/release-plz/release-plz/compare/*',
  # Don't check pull request links to avoid being rate limited
  'https://github.com/release-plz/release-plz/pull/*',
  'https://github.com/release-plz/release-plz/issues/*',
  # Files added in a pull request aren't on main until it's merged
  'https://raw.githubusercontent.com/release-plz/release-plz/main/*',
  # GitHub search returns 502 intermittently
  'https://github.com/search*',
  'https://wiki.alpinelinux.org/*'
]
