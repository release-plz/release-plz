name: Release-plz dist
description: Build binaries or finalize a draft release with release-plz
inputs:
  command:
    description: Distribution phase (build or finalize)
    default: build
  version:
    description: Release-plz version containing the dist commands
    required: true
  tag:
    description: Release tag (defaults to the dispatch event tag)
    default: ${{ github.event.client_payload.tag || github.event.inputs.tag }}
  manifest_path:
    description: Path to Cargo.toml
    default: Cargo.toml
  config:
    description: Optional release-plz configuration path
    required: false
runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.tag }}
        fetch-depth: 0
        persist-credentials: false
    - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
      with:
        tool: release-plz@${{ inputs.version }},cargo-dist@0.33.0
    - name: Run distribution phase
      shell: bash
      env:
        DIST_COMMAND: ${{ inputs.command }}
        DIST_TAG: ${{ inputs.tag }}
        DIST_MANIFEST: ${{ inputs.manifest_path }}
        DIST_CONFIG: ${{ inputs.config }}
        RELEASE_PLZ_DIST_MATRIX: ${{ toJSON(matrix) }}
        RELEASE_PLZ_DIST_JOB_INDEX: ${{ strategy.job-index }}
        RELEASE_PLZ_DIST_JOB_TOTAL: ${{ strategy.job-total }}
      run: |
        case "$DIST_COMMAND" in
          build|finalize) ;;
          *) echo "command must be build or finalize" >&2; exit 1 ;;
        esac
        if [[ -z "$DIST_TAG" ]]; then
          echo "A release tag is required" >&2
          exit 1
        fi
        args=(--tag "$DIST_TAG" --manifest-path "$DIST_MANIFEST")
        if [[ -n "$DIST_CONFIG" ]]; then
          args+=(--config "$DIST_CONFIG")
        fi
        release-plz dist "$DIST_COMMAND" "${args[@]}"
