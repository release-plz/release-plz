[package]
name = "changelog-perf-evidence"
version = "0.0.0"
edition = "2024"

[workspace]

[dependencies]
anyhow = "1.0.99"
cargo_metadata = "0.23.0"
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
git-cliff-core = { version = "2.14.2", default-features = false }
parse-changelog = { version = "0.6.13", default-features = false }
regex = "1.11.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
tracing = "0.1.41"
fs-err = "3.1.1"

[dev-dependencies]
expect-test = "1.5.1"

[[bin]]
name = "changelog-perf-evidence"
path = "bench.rs"
