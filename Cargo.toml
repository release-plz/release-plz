[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
license = "MIT OR Apache-2.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.99"
assert_cmd = "2.0.17"
base64 = "0.23.0"
camino = "1.1.12"
cargo_metadata = "0.23.0"
cargo = { version = "0.101.0" }
chrono = { version = "0.4.42", default-features = false }
clap = "4.5.47"
clap_complete = "4.5.57"
dunce = "1.0.5"
expect-test = "1.5.1"
flate2 = "1.1.10"
fs-err = "3.1.1"
futures = { version = "0.3.32", default-features = false, features = ["std"] }
git2 = "0.21.0"
git-cliff-core = { version = "2.14.2", default-features = false }
git-conventional = "1.0.0"
ignore = "0.4.23"
parse-changelog = { version = "0.6.13", default-features = false }
regex = "1.11.2"
reqwest = "0.13.1"
reqwest-middleware = { version = "0.5.0", features = ["json"] }
reqwest-retry = "0.9.0"
same-file = "1.0.6"
schemars = { version = "1.0.4", features = ["url2"] }
secrecy = "0.10.3"
semver = "1.0.26"
serde = "1.0.219"
serde_json = "1.0.143"
tempfile = "3.22.0"
tar = { version = "0.4.46", default-features = false }
tera = "2.0.0"
tokio = "1.47.1"
tokio-util = "0.7.20"
toml = { version = "1.0.0" }
toml_edit = { version = "0.25.0" }
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
url = "2.5.7"
walkdir = "2.5.0"
wiremock = "0.6.5"

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
closure_returning_async_block = "warn"
explicit_outlives_requirements = "warn"
if_let_rescope = "warn"
impl_trait_overcaptures = "warn"
impl_trait_redundant_captures = "warn"
let_underscore_drop = "warn"
macro_use_extern_crate = "warn"
missing_debug_implementations = "warn"
non_ascii_idents = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unsafe_attr_outside_unsafe = "warn"
unused = "warn"
unused_import_braces = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
struct_field_names = "allow"

as_underscore = "warn"
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
cargo_common_metadata = "warn"
exit = "warn"
filetype_is_file = "warn"
float_cmp_const = "warn"
get_unwrap = "warn"
if_then_some_else_none = "warn"
let_underscore_must_use = "warn"
let_unit_value = "warn"
lossy_float_literal = "warn"
manual_ignore_case_cmp = "warn"
manual_ok_or = "warn"
map_all_any_identity = "warn"
map_err_ignore = "warn"
map_flatten = "warn"
map_with_unused_argument_over_ranges = "warn"
mem_forget = "warn"
needless_as_bytes = "warn"
needless_borrow = "warn"
rc_buffer = "warn"
regex_creation_in_loops = "warn"
rest_pat_in_fully_bound_structs = "warn"
trait_duplication_in_bounds = "warn"
type_repetition_in_bounds = "warn"
unnecessary_map_or = "warn"
unneeded_field_pattern = "warn"
unseparated_literal_suffix = "warn"
use_self = "warn"
verbose_file_reads = "warn"

# Allowing optional lints has no effect, but we list them to
# make clear that we reviewed them and we decided to allow them
arbitrary_source_item_ordering = "allow"
decimal_literal_representation = "allow"
