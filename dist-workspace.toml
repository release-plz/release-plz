[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.33.0"
# CD is a reusable workflow called after release-plz creates the draft release.
ci = []
hosting = ["github"]
create-release = false
# Only distribute the release-plz binary
packages = ["release-plz"]
# Build only the required Cargo packages
precise-builds = true
targets = [
  "aarch64-apple-darwin",
  "aarch64-pc-windows-msvc",
  "aarch64-unknown-linux-gnu",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
]
