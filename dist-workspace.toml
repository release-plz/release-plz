[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.33.0"
# CD is a reusable workflow called after release-plz creates the draft release.
ci = []
hosting = ["github"]
create-release = false
packages = ["release-plz"]
precise-builds = true
targets = [
  "aarch64-apple-darwin",
  "aarch64-pc-windows-msvc",
  "aarch64-unknown-linux-gnu",
  "aarch64-unknown-linux-musl",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
]
# FreeBSD still uses upload-rust-binary-action in cd.yml: dist cannot cross-build it.
# Keep dist's archives intact and make additional flat .tar.gz archives for
# existing download scripts (including the Windows .tar.gz downloads).
unix-archive = ".tar.xz"
windows-archive = ".zip"
installers = []
source-tarball = false
checksum = "sha256"
msvc-crt-static = true
